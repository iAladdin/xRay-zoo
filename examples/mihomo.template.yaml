# Design template only; placeholders require a renderer that is not implemented.
# References: https://wiki.metacubex.one/en/config/proxies/vless/
mixed-port: 7890
allow-lan: false
bind-address: '127.0.0.1'
mode: rule
log-level: warning
ipv6: false

proxies:
  - name: 'US-East-01'
    type: vless
    server: '${NODE_ADDRESS}'
    port: 443
    uuid: '${ACCESS_UUID}'
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    packet-encoding: xudp
    servername: '${REALITY_SERVER_NAME}'
    client-fingerprint: chrome
    reality-opts:
      public-key: '${REALITY_PUBLIC_KEY}'
      short-id: '${REALITY_SHORT_ID}'

proxy-groups:
  - name: 'AUTO'
    type: url-test
    proxies:
      - 'US-East-01'
    url: '${HEALTHCHECK_URL}'
    interval: 300
  - name: 'SELECT'
    type: select
    proxies:
      - 'AUTO'
      - 'US-East-01'

rules:
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  - 'IP-CIDR,169.254.0.0/16,REJECT,no-resolve'
  - 'MATCH,SELECT'
